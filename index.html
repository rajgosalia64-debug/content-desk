<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Content Desk</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#1f1a30">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Content Desk">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f5f4f9; --surface:#ffffff; --soft:#efedf5; --line:#e2dfec; --line2:#d3cfe0;
  --ink:#1c1929; --ink2:#575268; --ink3:#8b869c;
  --side:#1f1a30; --side2:#2a2440; --side-ink:#ece9f6; --side-ink2:#a39cbb;
  --accent:#6a4be0;
  --ok:#157a44; --ok-bg:#e1f4e8; --warn:#9a6508; --warn-bg:#fdf0d3; --bad:#c42f2a; --bad-bg:#fbe3e1;
  --info:#1b67a8; --info-bg:#e0edf9; --vio:#6a45cc; --vio-bg:#ece5fb; --mute:#6f6a80; --mute-bg:#eceaf1;
  --fd:'Bricolage Grotesque','Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  --fb:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --shadow:0 1px 0 rgba(28,25,41,.04),0 10px 30px -18px rgba(28,25,41,.35);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#141220; --surface:#1c1929; --soft:#252136; --line:#302b44; --line2:#3d3754;
  --ink:#f0eef7; --ink2:#b9b3cc; --ink3:#857f99; --side:#0f0d18; --side2:#1d1a2b;
  --ok:#5fd694; --ok-bg:#15311f; --warn:#f0bd5a; --warn-bg:#382a0e; --bad:#ff8a80; --bad-bg:#3d1b1b;
  --info:#7cbcf5; --info-bg:#132a3e; --vio:#b9a2ff; --vio-bg:#2a2146; --mute:#aaa5bb; --mute-bg:#2a2638;
  --shadow:0 1px 0 rgba(0,0,0,.2),0 10px 30px -18px rgba(0,0,0,.8); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#141220; --surface:#1c1929; --soft:#252136; --line:#302b44; --line2:#3d3754;
  --ink:#f0eef7; --ink2:#b9b3cc; --ink3:#857f99; --side:#0f0d18; --side2:#1d1a2b;
  --ok:#5fd694; --ok-bg:#15311f; --warn:#f0bd5a; --warn-bg:#382a0e; --bad:#ff8a80; --bad-bg:#3d1b1b;
  --info:#7cbcf5; --info-bg:#132a3e; --vio:#b9a2ff; --vio-bg:#2a2146; --mute:#aaa5bb; --mute-bg:#2a2638;
  --shadow:0 1px 0 rgba(0,0,0,.2),0 10px 30px -18px rgba(0,0,0,.8); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font:15px/1.5 var(--fb);-webkit-font-smoothing:antialiased}
img,video{max-width:100%;display:block}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--fd);margin:0;letter-spacing:-.015em}
.ic{flex:none;vertical-align:-3px}
.muted{color:var(--ink3)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100vh}
.side{background:var(--side);color:var(--side-ink);padding:22px 16px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:22px;overflow-y:auto}
.brand{display:flex;gap:10px;align-items:center;padding:0 6px}
.brand .logo{width:34px;height:34px;border-radius:10px;background:var(--accent);display:grid;place-items:center;font:800 17px var(--fd);color:#fff;transition:background .3s}
.brand b{font:700 17px var(--fd);display:block;letter-spacing:-.01em}
.brand small{color:var(--side-ink2);font-size:12px}
.accts{display:flex;flex-direction:column;gap:3px}
.accts .lbl{font-size:12px;color:var(--side-ink2);padding:0 10px 4px}
.accts button{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;font-weight:600;font-size:14.5px;color:var(--side-ink2)}
.accts button i{width:10px;height:10px;border-radius:50%;flex:none}
.accts button:hover{background:var(--side2);color:var(--side-ink)}
.accts button.on{background:var(--side2);color:#fff;box-shadow:inset 3px 0 0 var(--accent)}
.accts button:focus-visible{outline:2px solid var(--accent)}
nav.nav{display:flex;flex-direction:column;gap:2px}
nav.nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:9px;color:var(--side-ink2);font-weight:500}
nav.nav button:hover{color:var(--side-ink);background:var(--side2)}
nav.nav button.on{color:#fff;background:color-mix(in srgb,var(--accent) 32%,transparent)}
nav.nav button:focus-visible{outline:2px solid var(--accent)}
nav.nav .badge{margin-left:auto;background:var(--accent);color:#fff;border-radius:99px;font-size:11.5px;font-weight:700;padding:1px 7px}
.me{margin-top:auto;border-top:1px solid var(--side2);padding-top:14px;display:flex;flex-direction:column;gap:8px}
.me .who{display:flex;align-items:center;gap:10px;padding:0 6px}
.av{width:32px;height:32px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.me .who b{display:block;font-size:14px}
.me .who small{color:var(--side-ink2);font-size:12px}
.me .tools{display:flex;gap:4px}
.me .tools button{all:unset;cursor:pointer;padding:7px;border-radius:8px;color:var(--side-ink2);display:grid;place-items:center}
.me .tools button:hover{background:var(--side2);color:#fff}
.sync{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--side-ink2);padding:0 6px}
.sync i{width:8px;height:8px;border-radius:50%;background:#46c67c;box-shadow:0 0 0 3px rgba(70,198,124,.2)}
.sync.local i{background:#f0bd5a;box-shadow:0 0 0 3px rgba(240,189,90,.2)}
.sync.err i{background:#ff6b61}

.main{padding:30px 38px 60px;min-width:0;max-width:1380px;width:100%}
.localbar{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:10px 14px;margin-bottom:20px;font-size:14px}
.vh{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;margin-bottom:26px}
.vh h1{font-size:clamp(28px,3.4vw,40px);font-weight:800;line-height:1.05}
.vh .sub{margin:8px 0 0;color:var(--ink2);max-width:62ch}
.vh-act{display:flex;gap:8px;flex-wrap:wrap}
.back{all:unset;cursor:pointer;color:var(--ink2);font-weight:600;font-size:14px;display:inline-flex;gap:4px;align-items:center;margin-bottom:10px}
.back:hover{color:var(--ink)}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line2);background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:9px;font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap;text-decoration:none;line-height:1.3}
.btn:hover{border-color:var(--ink3)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{filter:brightness(1.08)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.warn{background:var(--warn-bg);border-color:transparent;color:var(--warn)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink2)}
.btn.ghost:hover{background:var(--soft);color:var(--ink)}
.btn.danger:hover{color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px;gap:5px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.linkbtn{all:unset;cursor:pointer;color:var(--accent);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.seg{display:inline-flex;background:var(--soft);border-radius:10px;padding:3px;gap:2px}
.seg button{all:unset;cursor:pointer;padding:6px 12px;border-radius:8px;font-weight:600;font-size:13.5px;color:var(--ink2)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg button:focus-visible{outline:2px solid var(--accent)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
.toolbar .grow{flex:1}
input[type=text],input[type=search],input[type=password],input[type=number],input[type=date],input[type=time],input[type=url],input[type=tel],select,textarea{width:100%;border:1px solid var(--line2);background:var(--surface);border-radius:8px;padding:8px 11px;font-size:14.5px}
textarea{resize:vertical;line-height:1.5}
.toolbar select,.toolbar input{width:auto}
.toolbar input[type=search]{min-width:220px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 20%,transparent)}

.chip{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:2px 9px;font-size:12.5px;font-weight:600;white-space:nowrap;background:var(--mute-bg);color:var(--mute)}
.s-pending,.s-review,.s-planning{background:var(--warn-bg);color:var(--warn)}
.s-ready,.s-confirmed,.s-editing{background:var(--info-bg);color:var(--info)}
.s-scheduled,.s-shot{background:var(--vio-bg);color:var(--vio)}
.s-uploaded,.s-approved,.s-delivered,.s-ok{background:var(--ok-bg);color:var(--ok)}
.s-hold{background:var(--mute-bg);color:var(--mute)}
.s-over,.s-rejected,.s-late,.s-bad{background:var(--bad-bg);color:var(--bad)}
.s-changes,.s-risk{background:var(--warn-bg);color:var(--warn)}
.s-none{background:var(--mute-bg);color:var(--mute)}
.handle{font-weight:700;color:var(--ac,var(--accent))}
.tag{font-size:12.5px;font-weight:600;border:1px solid var(--line2);border-radius:6px;padding:0 6px;color:var(--ink2)}

/* ---------- panels ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 20px;box-shadow:var(--shadow);min-width:0}
.ph{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px}
.ph h2{font-size:19px;font-weight:700}
.ph .hint{color:var(--ink3);font-size:13px}
.count{background:var(--soft);border-radius:99px;padding:1px 9px;font-size:13px;font-weight:700;color:var(--ink2)}
.empty{color:var(--ink3);margin:6px 0;font-size:14px}
.emptybig{text-align:center;padding:50px 20px;border:1.5px dashed var(--line2);border-radius:14px;color:var(--ink2)}
.emptybig h3{font-size:20px;margin-bottom:6px;color:var(--ink)}
.emptybig p{margin:0 0 14px}

/* ---------- home ---------- */
.today-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px;margin-bottom:18px}
.tcol{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow);border-top:4px solid var(--ac)}
.tch{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.tch b{font:700 20px var(--fd);color:var(--ac)}
.tch span{font-size:13px;color:var(--ink3)}
.trow{display:grid;grid-template-columns:52px 74px minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.trow .tm{font-weight:700;font-variant-numeric:tabular-nums}
.trow .tc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink2)}
.home-grid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px}
.span2{grid-column:span 2}
.cov{width:100%;border-collapse:separate;border-spacing:4px;font-size:13px}
.cov th{font-weight:600;color:var(--ink3);text-align:center;padding:2px}
.cov th.acc{text-align:left;color:var(--ink);white-space:nowrap}
.cov th.td{color:var(--accent)}
.cov td{text-align:center;padding:0}
.cov td button{all:unset;cursor:pointer;display:block;width:100%;padding:8px 0;border-radius:8px;font-weight:700;font-variant-numeric:tabular-nums}
.cov .c0 button{background:var(--bad-bg);color:var(--bad)}
.cov .c1 button{background:var(--warn-bg);color:var(--warn)}
.cov .c2 button{background:var(--ok-bg);color:var(--ok)}
.cov td button:focus-visible{outline:2px solid var(--accent)}
.alerts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.alerts li{display:flex;gap:10px;align-items:flex-start;padding:9px 11px;border-radius:9px;background:var(--soft);font-size:14px}
.alerts li .dot{width:8px;height:8px;border-radius:50%;margin-top:7px;flex:none}
.alerts .bad .dot{background:var(--bad)} .alerts .warn .dot{background:var(--warn)} .alerts .info .dot{background:var(--info)}
.alerts li span{flex:1}
.act{list-style:none;padding:0;margin:0;font-size:14px}
.act li{padding:7px 0;border-top:1px solid var(--line);color:var(--ink2)}
.act li:first-child{border-top:0}
.act b{color:var(--ink)}
.act time{display:block;font-size:12px;color:var(--ink3)}

/* ---------- events ---------- */
.evrow{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.evrow:first-of-type{border-top:0}
.evdate{text-align:center;border-radius:10px;background:var(--soft);padding:6px 0;line-height:1.1}
.evdate b{display:block;font:800 22px var(--fd)}
.evdate small{font-size:12px;color:var(--ink2);font-weight:600}
.evrow h3{font-size:16.5px;font-weight:700;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.evmeta{font-size:13.5px;color:var(--ink2);margin-top:3px;display:flex;gap:6px 12px;flex-wrap:wrap;align-items:center}
.bar{height:6px;border-radius:9px;background:var(--soft);overflow:hidden;min-width:80px}
.bar i{display:block;height:100%;background:var(--ok);border-radius:9px}
.evside{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.evs-grid{display:grid;grid-template-columns:minmax(0,2fr) minmax(300px,1fr);gap:16px;align-items:start}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--line);gap:1px}
.cal .dow{background:var(--soft);font-size:12.5px;font-weight:700;color:var(--ink2);padding:6px 8px}
.cal .cell{background:var(--surface);min-height:98px;padding:5px;display:flex;flex-direction:column;gap:3px;min-width:0}
.cal .cell.out{background:var(--paper)}
.cal .cell.out .dn{color:var(--ink3)}
.cal .dn{font-size:12.5px;font-weight:700;padding:1px 4px;align-self:flex-start;border-radius:6px}
.cal .cell.today .dn{background:var(--accent);color:#fff}
.cal .ce{all:unset;cursor:pointer;font-size:12px;font-weight:600;line-height:1.25;padding:3px 6px;border-radius:5px;display:block}
.cal .ce>span{overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word}
.cal .ce:focus-visible{outline:2px solid var(--accent)}
.ce.ev{background:color-mix(in srgb,var(--ac,var(--accent)) 16%,var(--surface));color:var(--ink);box-shadow:inset 3px 0 0 var(--ac,var(--accent))}
.ce.dl{border:1px dashed var(--bad);color:var(--bad)}
.ce.sh{background:var(--vio-bg);color:var(--vio)}
.ce.more{color:var(--ink3)}
.cal .cell.pc{cursor:pointer}
.pdots{display:flex;flex-wrap:wrap;gap:3px;padding:0 3px}
.pdots i{width:9px;height:9px;border-radius:3px;background:var(--ac)}
.pdots i.pend{background:transparent;box-shadow:inset 0 0 0 2px var(--ac)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--ink2);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:10px;border-radius:3px;display:inline-block}
.calhead{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.calhead h2{font-size:22px;min-width:180px}

/* ---------- posts ---------- */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-bottom:22px}
.week button{all:unset;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:8px 10px;display:flex;flex-direction:column;gap:2px}
.week button.td{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.week button small{font-size:12px;color:var(--ink3);font-weight:600}
.week button b{font:700 18px var(--fd)}
.week button span{font-size:12px;color:var(--ink2)}
.week button:focus-visible{outline:2px solid var(--accent)}
.day{margin-bottom:26px;scroll-margin-top:20px}
.dayh{display:flex;align-items:center;gap:12px;margin-bottom:10px;flex-wrap:wrap}
.dayh h2{font-size:21px;font-weight:700}
.dayh .today-tag{background:var(--accent);color:#fff;border-radius:6px;padding:1px 8px;font-size:12.5px;font-weight:700}
.dayh .slots{color:var(--ink3);font-size:13.5px}
.dayh .grow{flex:1}
.plist{display:flex;flex-direction:column;gap:10px}
.post{display:grid;grid-template-columns:112px minmax(0,1fr) 170px;gap:16px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--ac);border-radius:12px;padding:12px;box-shadow:var(--shadow)}
.post.is-over{background:linear-gradient(90deg,var(--bad-bg),var(--surface) 30%)}
.pthumb{all:unset;cursor:pointer;position:relative;width:112px;aspect-ratio:4/5;border-radius:9px;overflow:hidden;background:var(--soft);display:grid;place-items:center;color:var(--ink3)}
.pthumb img,.pthumb video{width:100%;height:100%;object-fit:cover}
.pthumb:focus-visible{outline:2px solid var(--accent)}
.play{position:absolute;inset:auto auto 6px 6px;background:rgba(0,0,0,.6);color:#fff;border-radius:50%;width:26px;height:26px;display:grid;place-items:center}
.pcount{position:absolute;top:6px;right:6px;background:rgba(0,0,0,.65);color:#fff;border-radius:6px;font-size:12px;font-weight:700;padding:1px 6px}
.linkthumb{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;text-align:center;padding:6px}
.pbody{min-width:0;display:flex;flex-direction:column;gap:6px}
.pmeta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13.5px}
.cap{margin:0;white-space:pre-wrap;word-break:break-word;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;font-size:14.5px;cursor:pointer}
.cap.open{-webkit-line-clamp:unset;display:block}
.tags{margin:0;color:var(--info);font-size:13.5px;word-break:break-word}
.pact{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto}
.pside{display:flex;flex-direction:column;gap:8px;font-size:12.5px}
.stsel{font-weight:700;border:0!important;border-radius:8px;padding:7px 10px;cursor:pointer}
.stsel.s-over{background:var(--bad-bg);color:var(--bad)}

/* ---------- shoots ---------- */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:18px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px}
.stat small{color:var(--ink3);font-size:13px;font-weight:600}
.stat b{display:block;font:700 23px var(--fd);margin-top:2px}
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(268px,1fr);gap:12px;overflow-x:auto;padding-bottom:10px;align-items:start}
.bcol{background:var(--soft);border-radius:13px;padding:10px;min-height:120px}
.bcol h3{font-size:14.5px;font-weight:700;display:flex;justify-content:space-between;padding:2px 4px 10px}
.bcol h3 span{color:var(--ink3)}
.scard{all:unset;cursor:pointer;display:block;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:12px;margin-bottom:8px;box-shadow:var(--shadow);width:100%;box-sizing:border-box;border-top:3px solid var(--ac,var(--accent))}
.scard:hover{border-color:var(--line2)}
.scard:focus-visible{outline:2px solid var(--accent)}
.scard h4{margin:0 0 6px;font:700 15.5px var(--fd)}
.scard .row{font-size:13px;color:var(--ink2);display:flex;gap:6px;align-items:center;margin-top:4px}
.scard .chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}

.stages{display:flex;gap:4px;margin:4px 0 22px;overflow-x:auto}

.stages button.done{color:var(--ink2);border-bottom-color:color-mix(in srgb,var(--accent) 45%,transparent)}

.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:18px}
.facts div{background:var(--surface);padding:12px 15px}
.facts small{display:block;color:var(--ink3);font-size:12.5px;font-weight:600}

.sgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:16px;margin-bottom:16px}

.box{width:19px;height:19px;border-radius:6px;border:2px solid var(--line2);display:grid;place-items:center;flex:none;color:#fff}
.done .box{background:var(--ok);border-color:var(--ok)}

.vcard{background:var(--surface);border:1px solid var(--line);border-radius:13px;overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.vcard.st-approved{border-color:color-mix(in srgb,var(--ok) 50%,var(--line))}
.vcard.st-rejected{opacity:.8}

.vplayer video{width:100%;height:100%;object-fit:contain}
.vplayer.lnk{aspect-ratio:16/7}
.vinfo{padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.vinfo h4{margin:0;font:700 15px var(--fd);display:flex;gap:8px;align-items:center;flex-wrap:wrap;word-break:break-word}

/* ---------- tables ---------- */

.modal{position:fixed;inset:0;z-index:50;display:grid;place-items:start center;padding:4vh 16px;overflow-y:auto}

.mform header{display:flex;justify-content:space-between;align-items:center;padding:18px 22px 6px}
.mform header h2{font-size:22px;font-weight:700}

.checks{display:flex;flex-wrap:wrap;gap:6px}

.mitem .rm{position:absolute;top:4px;right:4px;background:rgba(0,0,0,.65);color:#fff;border:0;border-radius:6px;width:24px;height:24px;cursor:pointer;display:grid;place-items:center}
.mitem .ord{position:absolute;left:4px;bottom:4px;background:rgba(0,0,0,.65);color:#fff;border-radius:5px;padding:0 5px;font-size:11px;font-weight:700}
.viewer{display:flex;flex-direction:column;gap:14px;padding:6px 22px 8px}
.viewer .vm{background:#0c0a12;border-radius:12px;overflow:hidden;display:grid;place-items:center}
.viewer .vm img,.viewer .vm video{max-height:62vh;width:auto;margin:auto}
.vrow{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:13.5px}
.capbox{background:var(--soft);border-radius:10px;padding:12px 14px;white-space:pre-wrap;word-break:break-word;font-size:14.5px;max-height:240px;overflow-y:auto;user-select:text}
.err{color:var(--bad);font-size:13.5px;font-weight:600;min-height:1em;margin:0}
.note{font-size:13px;color:var(--ink3);margin:0}

/* ---------- auth ---------- */
.auth{min-height:100vh;display:grid;grid-template-columns:minmax(0,1fr) minmax(360px,480px)}
.auth .art{background:var(--side);color:var(--side-ink);padding:48px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.auth .art h1{font-size:clamp(34px,4.6vw,62px);font-weight:800;line-height:1;max-width:11ch;letter-spacing:-.03em}
.auth .art p{color:var(--side-ink2);max-width:44ch}
.auth .handles{display:flex;flex-direction:column;gap:6px;font:700 clamp(22px,2.4vw,32px) var(--fd)}
.auth .handles span:nth-child(1){color:#ff6f9f}
.auth .handles span:nth-child(2){color:#6fa3ff}
.auth .formside{display:flex;align-items:center;justify-content:center;padding:40px 28px;background:var(--surface)}
.auth form{width:100%;max-width:360px;display:flex;flex-direction:column;gap:14px}
.auth form h2{font-size:28px;font-weight:800}
.auth form .btn{justify-content:center;padding:11px}
.boot{min-height:100vh;display:grid;place-items:center;color:var(--ink2)}
.spin{width:28px;height:28px;border:3px solid var(--line2);border-top-color:var(--accent);border-radius:50%;animation:sp 0.8s linear infinite;margin:0 auto 12px}
@keyframes sp{to{transform:rotate(360deg)}}

.toasts{position:fixed;bottom:max(18px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.3);max-width:90vw;animation:pop .2s ease-out}
.toast.err{background:var(--bad);color:#fff}
.toast.ok{background:var(--ok);color:#fff}


/* ---------- drive previews ---------- */
.vm.frame{width:min(100%,42vh);aspect-ratio:9/14;margin:0 auto;background:#0c0a12}
.vm.frame iframe{width:100%;height:100%;border:0;display:block}
button.vplayer{all:unset;cursor:pointer;position:relative;display:grid;place-items:center;width:100%;box-sizing:border-box;background:#0c0a12;aspect-ratio:9/12;overflow:hidden;color:#aaa}
button.vplayer img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
button.vplayer:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.bigplay{position:relative;width:58px;height:58px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;display:grid;place-items:center;padding-left:4px;box-sizing:border-box}
.pthumb .linkthumb,.mitem .linkthumb{color:var(--ink3)}
.mitem img{width:100%;height:100%;object-fit:cover}
/* ---------- talent ---------- */
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.tcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);display:grid;grid-template-columns:92px minmax(0,1fr);gap:14px;padding:14px}
.tcard.dnb{opacity:.6}
.tphoto{all:unset;cursor:pointer;width:92px;aspect-ratio:4/5;border-radius:10px;overflow:hidden;background:var(--soft);display:grid;place-items:center;font:800 26px var(--fd);color:var(--ink3);box-sizing:border-box}
.tphoto img{width:100%;height:100%;object-fit:cover}
.tphoto:focus-visible{outline:2px solid var(--accent)}
.tbody{display:flex;flex-direction:column;gap:5px;min-width:0}
.tcard h3{font-size:17.5px;font-weight:700}
.linkbtn.plain{text-decoration:none;color:inherit}
.linkbtn.plain:hover{text-decoration:underline}
.tsub{font-size:13.5px;color:var(--ink2)}
.ig{color:var(--info);font-weight:600;font-size:13.5px;text-decoration:none}
.ig:hover{text-decoration:underline}
.tbody .chips{display:flex;flex-wrap:wrap;gap:4px}
.rates{font-size:13.5px;font-weight:700}
.tfoot{display:flex;gap:6px 10px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--ink3);margin-top:auto;padding-top:4px}
.stars{color:#d99a00;letter-spacing:1px}
.phead{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.phead .tphoto{width:112px;cursor:default}
.photo-prev{display:flex;gap:14px;align-items:center}
.picklist{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:6px;max-height:330px;overflow-y:auto;padding:2px;margin-top:6px}
.pick{cursor:pointer;display:block;position:relative}
.pick[hidden]{display:none}
.pick input{position:absolute;opacity:0;pointer-events:none}
.pk{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line2);border-radius:10px;padding:8px;height:100%;box-sizing:border-box}
.pick input:checked+.pk{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 9%,var(--surface));box-shadow:inset 0 0 0 1px var(--accent)}
.pick input:focus-visible+.pk{outline:2px solid var(--accent);outline-offset:2px}
.pav{width:40px;height:40px;border-radius:50%;overflow:hidden;background:var(--soft);display:grid;place-items:center;font-weight:700;font-size:13px;color:var(--ink2);flex:none}
.pav img{width:100%;height:100%;object-fit:cover}
.pkt{display:flex;flex-direction:column;min-width:0;font-size:13px}
.pkt small{color:var(--ink3)}
.pkt .mt{color:var(--ok);font-weight:600}
.pkt .bk{color:var(--bad);font-weight:600}
.ratebox{background:var(--soft);border-radius:10px;padding:0 12px;font-size:13.5px;line-height:1.6}
.ratebox:not(:empty){padding:10px 12px}
.prow{display:flex;gap:12px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.prow:first-child{border-top:0}
.prow .pinfo{flex:1;min-width:0;display:flex;flex-direction:column;font-size:13px;color:var(--ink2)}
.prow .pinfo .linkbtn,.prow .pinfo b{font-weight:700;font-size:15px;color:var(--ink)}
.rate{display:flex}
.rate button{all:unset;cursor:pointer;font-size:19px;line-height:1;color:var(--line2);padding:0 1px}
.rate button.on{color:#d99a00}
.rate button:focus-visible{outline:2px solid var(--accent)}
/* ---------- installed app ---------- */
@media (display-mode: standalone){body{overscroll-behavior-y:none}}
.install-steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:10px;font-size:15px}
.install-steps b{font-weight:700}
/* ---------- responsive ---------- */
@media (max-width:1100px){.evs-grid,.home-grid{grid-template-columns:minmax(0,1fr)}.span2{grid-column:auto}}
@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{position:relative;height:auto;padding-top:max(12px,env(safe-area-inset-top));padding-left:max(14px,env(safe-area-inset-left));padding-right:max(14px,env(safe-area-inset-right));flex-direction:column;gap:10px;padding:12px 14px;z-index:20}
  .brand small,.accts .lbl{display:none}
  .accts{flex-direction:row;overflow-x:auto}
  .accts button{white-space:nowrap;padding:6px 10px;font-size:13.5px}
  nav.nav{flex-direction:row;overflow-x:auto;gap:2px}
  nav.nav button{white-space:nowrap;padding:7px 10px;font-size:14px}
  .me{margin:0;border:0;padding:0;flex-direction:row;align-items:center;justify-content:space-between;position:absolute;top:max(10px,env(safe-area-inset-top));right:max(12px,env(safe-area-inset-right))}
  .me .who,.sync{display:none}
  .main{padding:20px 16px 50px}
  .post{grid-template-columns:88px minmax(0,1fr)}
  .pthumb{width:88px}
  .pside{grid-column:1/-1;flex-direction:row;align-items:center;flex-wrap:wrap}
  .pside .stsel{width:auto}
  .trow{grid-template-columns:46px minmax(0,1fr) auto;row-gap:4px}
  .trow .tt{display:none}
  .trow .btn{grid-column:1/-1;justify-self:start}
  .grid2,.grid3{grid-template-columns:minmax(0,1fr)}
  .auth{grid-template-columns:minmax(0,1fr)}
  .auth .art{padding:30px 24px;gap:20px}
  .cal .cell{min-height:70px}
  .cal .ce{font-size:10.5px;padding:1px 3px}
  .week{grid-template-columns:repeat(7,minmax(64px,1fr));overflow-x:auto}
  dl.kv{grid-template-columns:110px minmax(0,1fr)}
}

<body>
<div id="app"></div>
<div id="modal" class="modal" hidden><div class="mback"></div><div class="mcard" role="dialog" aria-modal="true"></div></div>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script src="firebase-config.js"></script>
<script type="module">
import * as FB from './vendor/firebase.js';
/* ================= utilities ================= */
const $=(s,r=document)=>r.querySelector(s);
const h=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=s=>{const [y,m,d]=String(s).split('-').map(Number);return new Date(y,(m||1)-1,d||1)};
const today=()=>ymd(new Date());
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return ymd(d)};
const diff=(a,b)=>Math.round((parse(a)-parse(b))/864e5);
const fmtD=(s,o={day:'numeric',month:'short'})=>s?parse(s).toLocaleDateString('en-IN',o):'—';
const fmtLong=s=>fmtD(s,{weekday:'short',day:'numeric',month:'short',year:'numeric'});
const money=n=>'₹'+(Number(n)||0).toLocaleString('en-IN');
const num=v=>Number(v)||0;
const clone=o=>JSON.parse(JSON.stringify(o||{}));
const weekStart=s=>{const d=parse(s);return addDays(s,-((d.getDay()+6)%7))};
const monthFirst=s=>s.slice(0,8)+'01';
const addMonths=(s,n)=>{const d=parse(s);d.setDate(1);d.setMonth(d.getMonth()+n);return ymd(d)};
const rel=n=>n===0?'today':n===1?'tomorrow':n===-1?'yesterday':n>0?`in ${n} days`:`${-n} days ago`;
const fmtTime=t=>{if(!t)return'';const [H,M]=t.split(':').map(Number);return `${(H%12)||12}:${pad(M)} ${H<12?'am':'pm'}`};
const safeUrl=u=>/^https?:\/\//i.test(String(u||'').trim())?String(u).trim():'';
const first=n=>String(n||'').split(' ')[0];
const initials=n=>String(n||'?').split(' ').map(x=>x[0]).slice(0,2).join('').toUpperCase();

function evInfo(ev){
  const dl=adDeadline(ev),t=today(),shoots=[...S.shoots.values()].filter(s=>s.eventId===ev.id);
  const target=shoots.reduce((n,s)=>n+num(s.numVideos),0),approved=shoots.reduce((n,s)=>n+approvedCount(s),0);
  const dLeft=diff(dl,t),evLeft=diff(ev.date,t);let state,label;
  if(target>0&&approved>=target){state='ok';label='Ads ready'}

const Q={};
function enqueue(path,fn){const p=(Q[path]||Promise.resolve()).catch(()=>{}).then(fn);Q[path]=p;return p}
function dbErrMsg(e){const c=(e&&e.code)||'';if(c.includes('permission-denied'))return'You don\'t have permission for this change.';if(c.includes('resource-exhausted'))return'The free daily limit was reached. Changes will work again tomorrow.';if(c.includes('unavailable'))return'You\'re offline. The change will sync when you reconnect.';return'Couldn\'t save. Check your connection and try again.'}
const clean=o=>JSON.parse(JSON.stringify(o));
async function save(col,id,data){
  const d=clean({...data,id,updatedAt:Date.now(),updatedBy:S.me?S.me.id:null});
  if(S.fs){try{await enqueue(col+'/'+id,()=>FB.setDoc(FB.doc(S.fs,col,id),d))}catch(e){toast(dbErrMsg(e),'err');throw e}}

}

function driveId(u){u=String(u||'');const m=u.match(/\/file\/d\/([\w-]{10,})/)||u.match(/[?&]id=([\w-]{10,})/);return m?m[1]:null}
const isFolder=u=>/\/folders\//.test(String(u||''));
const thumbUrl=(u,w=640)=>{const id=driveId(u);if(id)return`https://drive.google.com/thumbnail?id=${id}&sz=w${w}`;if(/\.(jpe?g|png|webp|gif)(\?|$)/i.test(u||''))return safeUrl(u);return''};
const previewUrl=u=>{const id=driveId(u);return id?`https://drive.google.com/file/d/${id}/preview`:''};
const dlUrl=u=>{const id=driveId(u);return id?`https://drive.google.com/uc?export=download&id=${id}`:safeUrl(u)};
const openUrl=u=>{const id=driveId(u);return id?`https://drive.google.com/file/d/${id}/view`:safeUrl(u)};
function imgOrLink(u,w){const t=thumbUrl(u,w);return t?`<img src="${h(t)}" alt="" loading="lazy" referrerpolicy="no-referrer" data-fb="1">`:`<span class="linkthumb">${ic('link',22)}<small>${isFolder(u)?'Drive folder':'Link'}</small></span>`}
document.addEventListener('error',e=>{const t=e.target;if(!t||t.tagName!=='IMG'||!t.dataset.fb)return;
  if(t.dataset.fb==='av'){t.replaceWith(document.createTextNode(t.dataset.alt||'?'));return}
  const s=document.createElement('span');s.className='linkthumb';s.innerHTML=`${ic('drive',22)}<small>Tap to open</small>`;t.replaceWith(s)},true);
function saveFile(filename,data){try{const b=data instanceof Blob?data:new Blob([data],{type:/\.csv$/.test(filename)?'text/csv':'text/plain'});const u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);return true}catch(e){toast('Download didn\'t start. Try again.','err');return false}}

    if(!S.authLoaded||!S.metaLoaded)return setScreen('boot',bootHtml('Connecting'));

    if(!(S.loaded.settings&&S.loaded.team))return setScreen('boot',bootHtml('Syncing your team workspace'));
  }
  if(!force&&isPlaying()){S.pending=true;return}
  const keep={};document.querySelectorAll('#main [data-keep]').forEach(el=>{if(el.id)keep[el.id]=el.value});
  const ae=document.activeElement,fid=ae&&ae.id&&ae.closest&&ae.closest('#main')?ae.id:null;let ss=null,se=null;try{ss=ae.selectionStart;se=ae.selectionEnd}catch(e){}

const sel=(name,opts,val,attrs='')=>`<select name="${name}" ${attrs}>${opts.map(o=>{const[v,l]=Array.isArray(o)?o:[o,o];return`<option value="${h(v)}" ${String(v)===String(val??'')?'selected':''}>${h(l)}</option>`}).join('')}</select>`;
const checks=(name,opts,vals=[])=>`<div class="checks">${opts.map(o=>{const[v,l]=Array.isArray(o)?o:[o,o];return`<label class="ck"><input type="checkbox" name="${name}" value="${h(v)}" ${(vals||[]).includes(v)?'checked':''}><span>${h(l)}</span></label>`}).join('')}</div>`;
function formObj(form){const o={};const fd=new FormData(form);const cb=new Set([...form.querySelectorAll('input[type=checkbox]')].map(c=>c.name).filter(Boolean));
  for(const[k,v]of fd.entries()){if(cb.has(k))(o[k]=o[k]||[]).push(v);else o[k]=typeof v==='string'?v.trim():v}
  cb.forEach(n=>{if(!(n in o))o[n]=[]});return o}
const userOpts=(blank='Unassigned')=>[['',blank],...users().filter(u=>u.active!==false).map(u=>[u.id,u.name])];
const eventOpts=()=>[['','No event'],...[...S.events.values()].sort((a,b)=>a.date<b.date?-1:1).map(e=>[e.id,`${e.name} (${fmtD(e.date)})`])];

function openModal(html,wide){const m=$('#modal'),c=m.querySelector('.mcard');c.className='mcard'+(wide?' wide':'');c.innerHTML=html;m.hidden=false;document.body.style.overflow='hidden';const f=c.querySelector('input:not([type=hidden]):not([type=file]),select,textarea');if(f)setTimeout(()=>f.focus(),30)}
function closeModal(){const m=$('#modal');m.hidden=true;m.querySelector('.mcard').innerHTML='';document.body.style.overflow='';m.querySelectorAll('video').forEach(v=>v.pause());S.draft=null}
function toast(msg,kind){const t=document.createElement('div');t.className='toast '+(kind||'');t.textContent=msg;$('#toasts').appendChild(t);setTimeout(()=>t.remove(),kind==='err'?5200:2800)}
function confirmBox(title,body,yes,fn){S.confirmFn=fn;openModal(`<div class="mform"><header><h2>${h(title)}</h2><button class="x" data-act="closeModal" aria-label="Close">${ic('x')}</button></header><div class="mbody"><p class="note" style="font-size:14.5px;color:var(--ink2)">${h(body)}</p></div><footer><button class="btn" data-act="closeModal">Cancel</button><button class="btn bad" data-act="confirmYes">${h(yes)}</button></footer></div>`)}

/* ================= OVERVIEW ================= */
function statusChip(p){const s=POST_STATUS.find(x=>x[0]===p.status)||POST_STATUS[0];return isOverdue(p)?'<span class="chip s-over">Overdue</span>':`<span class="chip s-${s[0]}">${s[1]}</span>`}
function vHome(){
  const t=today(),accs=visAccts(),posts=postsList(),tp=posts.filter(p=>p.date===t),up=tp.filter(p=>p.status==='uploaded').length;
  const hr=new Date().getHours(),greet=hr<12?'Good morning':hr<17?'Good afternoon':'Good evening';
  const alerts=computeAlerts(),evs=eventsList().filter(e=>(e.endDate||e.date)>=t).slice(0,5);
  return`<header class="vh"><div><h1>${greet}, ${h(first(S.me.name))}</h1><p class="sub">${fmtD(t,{weekday:'long',day:'numeric',month:'long'})}. ${tp.length?`${up} of ${tp.length} posts uploaded today.`:'No posts planned for today yet.'}</p></div>
    <div class="vh-act"><button class="btn pri" data-act="newPost" data-date="${t}">${ic('plus')}New post</button><button class="btn" data-act="newShoot">${ic('film')}Plan a shoot</button></div></header>
  <section class="today-grid">${accs.map(a=>todayCol(a,tp.filter(p=>p.account===a.id).sort(byTime))).join('')||'<p class="empty">Add an Instagram account in Settings.</p>'}</section>
  <div class="home-grid">
    <section class="panel"><div class="ph"><h2>Next 7 days</h2><span class="hint">Posts planned vs daily target. Tap a day to open it.</span></div>${coverage(accs,posts)}</section>
    <section class="panel"><div class="ph"><h2>Needs attention</h2><span class="count">${alerts.length}</span></div>${alerts.length?`<ul class="alerts">${alerts.slice(0,9).map(a=>`<li class="${a.lv}"><i class="dot"></i><span>${a.html}</span>${a.act?`<button class="btn sm" ${a.act}>Open</button>`:''}</li>`).join('')}</ul>`:'<p class="empty">Nothing overdue or at risk right now.</p>'}</section>
    <section class="panel"><div class="ph"><h2>Upcoming events</h2><button class="btn sm ghost" data-act="nav" data-view="events">Open calendar</button></div>${evs.length?evs.map(eventRow).join(''):`<p class="empty">No upcoming events. <button class="linkbtn" data-act="newEvent">Add an event</button></p>`}</section>
    <section class="panel"><div class="ph"><h2>Recent activity</h2></div>${S.log.length?`<ul class="act">${S.log.slice(0,8).map(e=>`<li><b>${h(userName(e.by))}</b> ${h(e.text)}<time>${ago(e.t)}</time></li>`).join('')}</ul>`:'<p class="empty">Team activity shows up here.</p>'}</section>
  </div>`;
}
function todayCol(a,list){const up=list.filter(p=>p.status==='uploaded').length;
  return`<div class="tcol" style="--ac:${h(a.color)}"><div class="tch"><b>@${h(a.handle)}</b><span>${up} of ${list.length} uploaded, target ${num(a.target)||3}/day</span></div>
  ${list.map(p=>`<div class="trow"><span class="tm">${p.time?h(p.time):'—'}</span><span class="tag tt">${h(p.type)}</span><span class="tc">${h((p.caption||'No caption yet').split('\n')[0])}</span>${statusChip(p)}${p.status!=='uploaded'?`<button class="btn sm" data-act="markUploaded" data-id="${p.id}">${ic('check',14)}Mark uploaded</button>`:`<button class="btn sm ghost" data-act="viewPost" data-id="${p.id}">View</button>`}</div>`).join('')||`<p class="empty">Nothing planned for today. <button class="linkbtn" data-act="newPost" data-date="${today()}" data-acct="${h(a.id)}">Add a post</button></p>`}</div>`}
function coverage(accs,posts){const t=today(),days=[...Array(7)].map((_,i)=>addDays(t,i));
  return`<div class="tblwrap"><table class="cov"><thead><tr><th></th>${days.map((d,i)=>`<th class="${i===0?'td':''}">${fmtD(d,{weekday:'short'})}<br>${parse(d).getDate()}</th>`).join('')}</tr></thead><tbody>
  ${accs.map(a=>`<tr><th class="acc">@${h(a.handle)}</th>${days.map(d=>{const n=posts.filter(p=>p.account===a.id&&p.date===d).length,tg=num(a.target)||3;return`<td class="${n===0?'c0':n<tg?'c1':'c2'}"><button data-act="goPostsDate" data-date="${d}" aria-label="${n} of ${tg} posts on ${fmtD(d)}">${n}/${tg}</button></td>`}).join('')}</tr>`).join('')}</tbody></table></div>`}
function computeAlerts(){
  const t=today(),out=[],posts=postsList();
  const od=posts.filter(isOverdue);if(od.length)out.push({lv:'bad',html:`<b>${od.length} post${od.length>1?'s':''}</b> from earlier days ${od.length>1?'were':'was'} never marked uploaded.`,act:'data-act="postsOverdue"'});
  for(const ev of eventsList()){if(ev.date<t)continue;const i=evInfo(ev);
    if(i.state==='late')out.push({lv:'bad',html:`Ad videos for <b>${h(ev.name)}</b> were due ${fmtD(i.dl)}. ${i.approved} of ${i.target||'?'} approved.`,act:`data-act="viewEvent" data-id="${ev.id}"`});
    else if(i.state==='risk')out.push({lv:'warn',html:`<b>${h(ev.name)}</b>: ${i.label.toLowerCase()}. Ad videos due ${rel(i.dLeft)} (${fmtD(i.dl)}).`,act:`data-act="viewEvent" data-id="${ev.id}"`})}
  const nr=allVideos().filter(x=>x.v.status==='review').length;if(nr)out.push({lv:'info',html:`<b>${nr} video${nr>1?'s':''}</b> waiting for approval.`,act:'data-act="nav" data-view="review"'});
  for(const s of shootsList()){
    if(s.shootDate&&stageIdx(s.stage)<2){const d=diff(s.shootDate,t);const miss=CHECK.slice(0,7).filter(c=>!(s.checklist||{})[c[0]]).length;
      if(d>=0&&d<=3&&miss)out.push({lv:'warn',html:`Shoot <b>${h(s.title)}</b> is ${rel(d)} and ${miss} prep item${miss>1?'s are':' is'} unchecked.`,act:`data-act="openShoot" data-id="${s.id}"`});
      if(d<0)out.push({lv:'warn',html:`Shoot <b>${h(s.title)}</b> date has passed but it's still in ${h((STAGES.find(x=>x[0]===s.stage)||STAGES[0])[1])}.`,act:`data-act="openShoot" data-id="${s.id}"`})}
    const dl=shootDeadline(s);if(dl&&stageIdx(s.stage)<5&&diff(dl,t)<0)out.push({lv:'bad',html:`<b>${h(s.title)}</b> missed its delivery deadline (${fmtD(dl)}).`,act:`data-act="openShoot" data-id="${s.id}"`});
    if(stageIdx(s.stage)>=2&&s.paymentStatus!=='paid'){const bal=budget(s).balance;if(bal>0)out.push({lv:'info',html:`${money(bal)} still to pay for <b>${h(s.title)}</b>.`,act:`data-act="openShoot" data-id="${s.id}"`})}
  }
  const rank={bad:0,warn:1,info:2};return out.sort((a,b)=>rank[a.lv]-rank[b.lv]);
}
function eventRow(ev){const i=evInfo(ev),d=parse(ev.date),pct=i.target?Math.min(100,Math.round(i.approved/i.target*100)):0;

function vPosts(){
  const U=S.ui.posts,t=today();if(!U.anchor)U.anchor=weekStart(t);if(!U.month)U.month=monthFirst(t);

  const q=U.q.toLowerCase();const all=postsList().filter(filt);
  let body;
  if(q){const res=all.filter(p=>((p.caption||'')+' '+(p.hashtags||'')+' '+(p.notes||'')).toLowerCase().includes(q)).sort((a,b)=>a.date<b.date?1:-1);
    body=(S.fs?`<p class="note" style="margin-bottom:8px">Searching posts from ${fmtD(S.postsFrom,{day:'numeric',month:'short',year:'numeric'})} onwards. <button class="linkbtn" data-act="loadOlder">Include 3 more months</button></p>`:'')+(res.length?`<p class="note" style="margin-bottom:12px">${res.length} post${res.length>1?'s':''} match "${h(U.q)}"</p><div class="plist">${res.map(p=>`<div><div class="muted" style="font-size:13px;font-weight:600;margin:4px 0">${fmtLong(p.date)}</div>${postCard(p)}</div>`).join('')}</div>`:`<div class="emptybig"><h3>No posts match "${h(U.q)}"</h3><p>Try another word from the caption or hashtags.</p></div>`)}
  else if(U.status==='overdue'){const res=all.sort((a,b)=>a.date<b.date?-1:1);body=res.length?`<div class="plist">${res.map(p=>`<div><div class="muted" style="font-size:13px;font-weight:600;margin:4px 0">${fmtLong(p.date)}</div>${postCard(p)}</div>`).join('')}</div>`:'<div class="emptybig"><h3>No overdue posts</h3><p>Every past post has been uploaded or put on hold.</p></div>'}
  else if(U.mode==='month')body=postsMonth(all);
  else body=postsWeek(all);
  const nav=q||U.status==='overdue'?'':U.mode==='month'?`<div class="calhead"><button class="btn sm" data-act="pMonth" data-d="-1" aria-label="Previous month">${ic('left')}</button><button class="btn sm" data-act="pMonth" data-d="1" aria-label="Next month">${ic('right')}</button><h2>${parse(U.month).toLocaleDateString('en-IN',{month:'long',year:'numeric'})}</h2><button class="btn sm ghost" data-act="pToday">This month</button></div>`
    :`<div class="calhead"><button class="btn sm" data-act="pWeek" data-d="-7" aria-label="Previous week">${ic('left')}</button><button class="btn sm" data-act="pWeek" data-d="7" aria-label="Next week">${ic('right')}</button><h2>${fmtD(U.anchor)} – ${fmtD(addDays(U.anchor,6),{day:'numeric',month:'short',year:'numeric'})}</h2><button class="btn sm ghost" data-act="pToday">This week</button></div>`;
  return`<header class="vh"><div><h1>Posts</h1><p class="sub">Daily feed plan for ${S.acct==='all'?'both accounts':'@'+h((acc(S.acct)||{}).handle)}. Copy the caption, download the media, post on Instagram, then mark it uploaded.</p></div>
    <div class="vh-act"><button class="btn" data-act="exportPosts">${ic('down')}Export CSV</button><button class="btn pri" data-act="newPost">${ic('plus')}New post</button></div></header>
  <div class="toolbar"><div class="seg" role="group" aria-label="View"><button data-act="pMode" data-m="list" class="${U.mode==='list'?'on':''}">Week list</button><button data-act="pMode" data-m="month" class="${U.mode==='month'?'on':''}">Month</button></div>
    <select data-change="pStatus" aria-label="Filter by status">${[['all','All statuses'],...POST_STATUS,['overdue','Overdue only']].map(([v,l])=>`<option value="${v}" ${U.status===v?'selected':''}>${l}</option>`).join('')}</select>
    <select data-change="pType" aria-label="Filter by type">${[['all','All types'],...POST_TYPES.map(x=>[x,x])].map(([v,l])=>`<option value="${v}" ${U.type===v?'selected':''}>${l}</option>`).join('')}</select>

function budget(s){const total=num(s.creatorFee)+num(s.videographerFee)+num(s.otherCost);const paid=s.paymentStatus==='paid'?total:Math.min(total,num(s.advancePaid));return{total,paid,balance:total-paid}}

  if(vids.some(v=>v.status==='review')&&i<4)s.stage='review';

function creatorsList(){const U=S.ui.talent,q=U.q.toLowerCase();

  const rk=c=>num(c.ratePerVideo)||num(c.rateDay)||1e12;
  l.sort(U.sort==='rate'?(a,b)=>rk(a)-rk(b):U.sort==='rating'?(a,b)=>((ratingOf(b.id)||{}).avg||0)-((ratingOf(a.id)||{}).avg||0):U.sort==='shoots'?(a,b)=>personShoots(b.id).length-personShoots(a.id).length:U.sort==='new'?(a,b)=>(b.createdAt||0)-(a.createdAt||0):(a,b)=>String(a.name).localeCompare(b.name));

  ${ig?`<div><a class="ig" href="${h(ig)}" target="_blank" rel="noopener">${h(igHandle(c.handle))}</a>${c.followers?` <span class="muted" style="font-size:13px">${h(c.followers)} followers</span>`:''}</div>`:''}

  const bar=`<div class="toolbar">${tSelect('tRole',U.role,[['all','All roles'],...CREW_ROLES],'Role')}${tSelect('tAvail',U.avail,[['all','Any availability'],...AVAIL],'Availability')}${tSelect('tSort',U.sort,[['name','Sort: name'],['rate','Lowest day rate'],['rating','Highest rated'],['shoots','Most shoots'],['new','Recently added']],'Sort')}<span class="grow"></span><input type="search" id="talent-q" data-input="tSearch" placeholder="Name, city, gear, skill" value="${h(U.q)}" aria-label="Search crew"></div>`;

    <div class="chips">${(c.skills||[]).slice(0,4).map(x=>`<span class="tag">${h(x)}</span>`).join('')}</div>${crewRates(c)?`<div class="rates">${crewRates(c)}</div>`:''}

  <div class="full ratebox" id="pick-sum"></div>`}
function pickRefresh(){const f=$('#modal form[data-form=shoot]');if(!f)return;
  const g=f.elements.modelGender.value,q=(($('#pick-q')||{}).value||'').toLowerCase(),all=($('#pick-all')||{}).checked,date=f.elements.shootDate.value,sid=f.dataset.id;
  const vt=[...f.querySelectorAll('input[name=videoTypes]:checked')].map(x=>x.value);let vis=0,sel=[];
  f.querySelectorAll('.pick').forEach(el=>{const c=S.creators.get(el.dataset.id);if(!c)return;const on=el.querySelector('input').checked;let show=true;
    if(!all){if(g==='Female'||g==='Male')show=c.gender===g;else if(g==='Kids')show=!!num(c.age)&&num(c.age)<16;else if(g==='Not needed')show=false;if(c.status==='dnb')show=false}
    if(q&&!creatorText(c).includes(q))show=false;if(on){show=true;sel.push(c)}el.hidden=!show;if(show)vis++;
    const b=bookedOn(c.id,date,sid),m=(c.bestFor||[]).filter(x=>vt.some(v=>styleMatch(v,x)));
    el.querySelector('.bk').textContent=b?`Booked on "${b.title}" that day`:c.status==='busy'?'Marked busy':c.status==='dnb'?'Do not book':'';
    el.querySelector('.mt').textContent=m.length?'Good for '+m.join(', '):''});
  const pe=$('#pick-empty');if(pe)pe.hidden=vis>0;const pc=$('#pick-count');if(pc)pc.textContent=sel.length?sel.length+' selected':'tick one or more';
  const vg=S.crew.get(f.elements.videographerId.value),vn=$('#vg-note'),vb=vg&&bookedOn(vg.id,date,sid);if(vn){vn.textContent=vb?`booked on "${vb.title}" that day`:'';vn.style.color='var(--bad)'}
  const n=num(f.elements.numVideos.value),cf=sel.reduce((t,c)=>t+(num(c.ratePerVideo)&&n?num(c.ratePerVideo)*n:num(c.rateDay)),0),vf=vg?num(vg.rateDay)||num(vg.rateHalfDay):0;
  const box=$('#pick-sum');if(box)box.innerHTML=sel.length||vg?`<b>From saved rates:</b> ${sel.map(c=>`${h(c.name)} ${creatorRates(c)||'no rate saved'}`).join('; ')}${vg?`${sel.length?'; ':''}${h(vg.name)} ${crewRates(vg)||'no rate saved'}`:''}.<br>Suggested fees: creators ${money(cf)}${n?` (${n} videos)`:''}, videographer ${money(vf)}. <button type="button" class="linkbtn" data-act="useRates" data-cf="${cf}" data-vf="${vf}">Use these fees</button>`:''}
function talentBlock(s){const rows=[],rateable=stageIdx(s.stage||'planning')>=2;
  const row=(p,kind,label)=>{const act=kind==='c'?'viewCreator':'viewCrew',r=(s.ratings||{})[p.id]||0,ig=igUrl(p.handle),w=waUrl(p.phone);
    return`<div class="prow"><span class="pav">${photoEl(p)}</span><div class="pinfo"><button class="linkbtn plain" data-act="${act}" data-id="${p.id}">${h(p.name)}</button><small>${h(label)}${p.phone?`, <a href="tel:${h(p.phone)}">${h(p.phone)}</a>`:''}${w?`, <a href="${h(w)}" target="_blank" rel="noopener">WhatsApp</a>`:''}${ig?`, <a href="${h(ig)}" target="_blank" rel="noopener">${h(igHandle(p.handle))}</a>`:''}</small></div>
    ${rateable?`<div class="rate" role="group" aria-label="Rate ${h(p.name)}">${[1,2,3,4,5].map(n=>`<button data-act="rate" data-sid="${s.id}" data-pid="${p.id}" data-n="${n}" class="${n<=r?'on':''}" aria-label="${n} star${n>1?'s':''}">★</button>`).join('')}</div>`:''}</div>`};
  const vg=S.crew.get(s.videographerId),ed=S.crew.get(s.editorId);
  if(vg)rows.push(row(vg,'v','Videographer'));else if(s.videographer)rows.push(`<div class="prow"><span class="pav">${h(initials(s.videographer))}</span><div class="pinfo"><b>${h(s.videographer)}</b><small>Videographer${s.videographerPhone?', '+h(s.videographerPhone):''}</small></div></div>`);
  creatorsOf(s).forEach(c=>rows.push(row(c,'c',[c.gender,c.age?c.age+' yrs':'','creator'].filter(Boolean).join(', '))));
  if(!(s.creatorIds||[]).length&&s.model)rows.push(`<div class="prow"><span class="pav">${h(initials(s.model))}</span><div class="pinfo"><b>${h(s.model)}</b><small>Model${s.modelPhone?', '+h(s.modelPhone):''}</small></div></div>`);
  if(ed)rows.push(row(ed,'v','Editor'));
  (s.crewIds||[]).map(id=>S.crew.get(id)).filter(Boolean).forEach(c=>rows.push(row(c,'v',c.role)));
  return`<div style="margin-bottom:10px">${rows.join('')||`<p class="empty">No crew or talent chosen yet. <button class="linkbtn" data-act="editShoot" data-id="${s.id}">Choose from directory</button></p>`}${rows.length&&rateable?'<p class="note" style="margin-top:4px">Rate each person after the shoot. Ratings show up in the directory.</p>':''}</div>`}

async function saveTalent(col,f,label){
  const o=formObj(f),id=f.dataset.id,prev=id?(col==='creators'?S.creators:S.crew).get(id):null;
  const p={...(prev?clone(prev):{createdBy:S.me.id,createdAt:Date.now()}),...o,handle:igHandle(o.handle)};
  ['age','ratePerVideo','rateReel','rateHalfDay','rateDay','turnaround'].forEach(k=>{if(k in o)p[k]=o[k]===''?'':num(o[k])});
  if(col==='creators'){p.selfShoot=(o.flags||[]).includes('selfShoot');p.travel=(o.flags||[]).includes('travel');delete p.flags}
  await save(col,id||uid(),p);logAct(`${id?'updated':'added'} ${label} ${p.name}`);closeModal();render(true);toast(`${p.name} ${id?'saved':'added'}`,'ok')}

Object.assign(A,{
  tTab:el=>{S.ui.talent.tab=el.dataset.k;S.ui.talent.q='';S.ui.talent.avail='all';render(true)},
  goTalent:()=>{closeModal();go('talent')},
  newCreator:()=>openCreatorEditor(null),newCrew:()=>openCrewEditor(null),
  editCreator:el=>{closeModal();openCreatorEditor(el.dataset.id)},editCrew:el=>{closeModal();openCrewEditor(el.dataset.id)},
  viewCreator:el=>openCreatorView(el.dataset.id),viewCrew:el=>openCrewView(el.dataset.id),
  delCreator:el=>{const c=S.creators.get(el.dataset.id),n=personShoots(c.id).length;confirmBox(`Delete ${c.name}?`,n?`They are linked to ${n} shoot${n>1?'s':''}. Those shoots will no longer show their name.`:'Their profile is removed for everyone.','Delete',async()=>{await remove('creators',c.id);logAct(`deleted creator ${c.name}`);render(true)})},
  delCrew:el=>{const c=S.crew.get(el.dataset.id),n=personShoots(c.id).length;confirmBox(`Delete ${c.name}?`,n?`They are linked to ${n} shoot${n>1?'s':''}. Those shoots will no longer show their name.`:'Their profile is removed for everyone.','Delete',async()=>{await remove('crew',c.id);logAct(`deleted crew member ${c.name}`);render(true)})},
  shootWith:el=>{const k=el.dataset.k,id=el.dataset.id;closeModal();openShootEditor(null,k==='c'?{creatorIds:[id]}:k==='e'?{editorId:id}:{videographerId:id})},
  rmPhoto:()=>{if(S.draft){S.draft.photo=null;const p=$('#photo-prev');if(p)p.innerHTML='?'}},
  useRates:el=>{const f=$('#modal form[data-form=shoot]');if(!f)return;if(num(el.dataset.cf))f.elements.creatorFee.value=el.dataset.cf;if(num(el.dataset.vf))f.elements.videographerFee.value=el.dataset.vf;toast('Fees filled in from saved rates')},
  rate:el=>updShoot(el.dataset.sid,s=>{s.ratings=s.ratings||{};const n=+el.dataset.n;s.ratings[el.dataset.pid]=s.ratings[el.dataset.pid]===n?0:n}),
  exportTalent:async()=>{if(S.ui.talent.tab==='creators'){const rows=[['Name','Gender','Age','Instagram','Followers','City','Area','Phone','Email','Skin tone','Skin type','Height','Size','Hair','Languages','Best for','Categories','Self-shoot UGC','Travels','Per video','Collab reel','Half day','Full day','Usage & terms','Payment','Availability','Avg rating','Shoots','Notes']];
      [...S.creators.values()].forEach(c=>{const r=ratingOf(c.id);rows.push([c.name,c.gender,c.age,c.handle,c.followers,c.location,c.area,c.phone,c.email,c.skinTone,c.skinType,c.height,c.size,c.hair,(c.languages||[]).join('; '),(c.bestFor||[]).join('; '),(c.categories||[]).join('; '),c.selfShoot?'Yes':'No',c.travel?'Yes':'No',c.ratePerVideo,c.rateReel,c.rateHalfDay,c.rateDay,c.usage,c.upi,(AVAIL.find(x=>x[0]===c.status)||AVAIL[0])[1],r?r.avg.toFixed(1):'',personShoots(c.id).length,c.notes])});
      await saveFile(`creators_${today()}.csv`,csv(rows))}
    else{const rows=[['Name','Role','City','Phone','Email','Instagram','Good at','Equipment','Full day','Half day','Per edit','Turnaround days','Payment','Availability','Avg rating','Shoots','Notes']];
      [...S.crew.values()].forEach(c=>{const r=ratingOf(c.id);rows.push([c.name,c.role,c.location,c.phone,c.email,c.handle,(c.skills||[]).join('; '),(c.equipment||[]).join('; '),c.rateDay,c.rateHalfDay,c.ratePerVideo,c.turnaround,c.upi,(AVAIL.find(x=>x[0]===c.status)||AVAIL[0])[1],r?r.avg.toFixed(1):'',personShoots(c.id).length,c.notes])});
      await saveFile(`crew_${today()}.csv`,csv(rows))}}
});

  tGender:el=>{S.ui.talent.gender=el.value;render(true)},tBest:el=>{S.ui.talent.best=el.value;render(true)},tCat:el=>{S.ui.talent.cat=el.value;render(true)},
  tAvail:el=>{S.ui.talent.avail=el.value;render(true)},tSort:el=>{S.ui.talent.sort=el.value;render(true)},tRole:el=>{S.ui.talent.role=el.value;render(true)},
  pickRefresh:()=>pickRefresh()
});
Object.assign(IN,{

  photoPrev:el=>{const p=$('#photo-prev');if(p)p.innerHTML=photoEl({name:'?',photoLink:el.value.trim()})}
});
Object.assign(F,{creator:f=>saveTalent('creators',f,'creator'),crew:f=>saveTalent('crew',f,'crew member')});
document.addEventListener('change',e=>{if(e.target.closest&&e.target.closest('#modal form[data-form=shoot]'))pickRefresh()});
document.addEventListener('input',e=>{if(e.target.name==='numVideos'&&e.target.closest('#modal form[data-form=shoot]'))pickRefresh()});

/* ================= events wiring ================= */
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;const fn=A[el.dataset.act];if(!fn)return;if(el.tagName!=='LABEL')e.preventDefault();Promise.resolve(fn(el,e)).catch(err=>{console.error(err)})});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#modal').hidden){closeModal();return}
  if(e.key==='Enter'&&e.target.id==='draft-link'){e.preventDefault();A.addDraftLink();return}
  if((e.key==='Enter'||e.key===' ')&&e.target.matches('.cell.pc')){e.preventDefault();A.goPostsDate(e.target)}});
document.addEventListener('change',e=>{const el=e.target.closest('[data-change]');if(el&&C[el.dataset.change])Promise.resolve(C[el.dataset.change](el,e)).catch(err=>console.error(err))});
document.addEventListener('input',e=>{const el=e.target.closest('[data-input]');if(el&&IN[el.dataset.input])IN[el.dataset.input](el,e)});
document.addEventListener('submit',e=>{const f=e.target.closest('[data-form]');if(!f)return;e.preventDefault();const b=f.querySelector('[type=submit]');if(b)b.disabled=true;
  Promise.resolve(F[f.dataset.form](f)).catch(err=>console.error(err)).finally(()=>{if(b&&b.isConnected)b.disabled=false})});

/* ================= installable app ================= */
let installEvt=null;
const isStandalone=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
const isIOS=()=>/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvt=e});
window.addEventListener('appinstalled',()=>{installEvt=null;toast('Content Desk is installed. Open it from your home screen.','ok');scheduleRender()});
A.installApp=async()=>{
  if(installEvt){installEvt.prompt();try{await installEvt.userChoice}catch(e){}installEvt=null;return}
  const steps=isIOS()
    ?`<li>Open this page in <b>Safari</b> (not Chrome or Instagram's browser).</li><li>Tap the <b>Share</b> button (the square with an arrow).</li><li>Scroll down and tap <b>Add to Home Screen</b>, then <b>Add</b>.</li><li>Open Content Desk from your home screen and sign in once.</li>`
    :`<li>Open this page in <b>Chrome</b>.</li><li>Tap the <b>⋮ menu</b> at the top-right.</li><li>Tap <b>Install app</b> or <b>Add to Home screen</b>, then <b>Install</b>.</li><li>On a laptop, look for the install icon at the right end of the address bar.</li>`;
  openModal(`<div class="mform"><header><h2>Install Content Desk</h2><button class="x" data-act="closeModal" aria-label="Close">${ic('x')}</button></header><div class="mbody"><ol class="install-steps">${steps}</ol><p class="note">It gets its own icon, opens full-screen and stays signed in.</p></div><footer><button class="btn pri" data-act="closeModal">Got it</button></footer></div>`)};
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));

/* ================= boot ================= */
async function boot(){
  render();
  const c=window.FIREBASE_CONFIG;
  if(!c||!c.apiKey){S.mode='local';const me={id:'local',name:'Preview admin',email:'preview@local',role:'admin',canApprove:true,active:true};
    S.team={users:[me]};S.me=me;S.meDoc=me;S.loaded={settings:true,team:true,me:true};S.booted=true;render(true);return}
  S.app=FB.initializeApp(c);S.auth=FB.getAuth(S.app);
  try{S.fs=FB.initializeFirestore(S.app,{localCache:FB.persistentLocalCache({tabManager:FB.persistentMultipleTabManager()})})}catch(e){S.fs=FB.getFirestore(S.app)}
  S.mode='live';
  FB.onSnapshot(FB.doc(S.fs,'config','meta'),s=>{S.meta=s.exists()?s.data():null;S.metaLoaded=true;scheduleRender()},()=>{S.meta={};S.metaLoaded=true;scheduleRender()});
  FB.onAuthStateChanged(S.auth,u=>{S.authUser=u;S.authLoaded=true;if(u)subscribeMe(u);else{if(S.meUnsub){S.meUnsub();S.meUnsub=null}unsubAll();resetData()}S.screen=null;render(true)});
  window.addEventListener('online',()=>{if(S.mode==='error'){S.mode='live';scheduleRender()}});
  S.booted=true;render(true);
}
boot();
